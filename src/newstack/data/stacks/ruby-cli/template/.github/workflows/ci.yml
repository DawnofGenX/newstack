name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test on ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Syntax
        run: |
          for file in $(git ls-files '*.rb' 'bin/*'); do
            ruby -cw "$file" > /dev/null
          done
      - name: Test
        run: rake test
      - name: Help
        run: bin/{{ npm_name }} --help
      - name: Unknown option exits 2
        run: |
          set +e
          bin/{{ npm_name }} --nope > /dev/null 2>&1
          status=$?
          test "$status" -eq 2
