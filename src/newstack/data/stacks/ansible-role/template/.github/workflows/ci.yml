name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  role:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_FORCE_COLOR: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.17,<3"
          ansible-playbook --version | head -1

      - name: Syntax check
        run: ansible-playbook --syntax-check -i localhost, tests/playbook.yml

      - name: Apply the role
        run: ansible-playbook -i localhost, -e textstat_prefix=$PWD/.play/prefix tests/playbook.yml

      - name: Verify the installed state
        run: ansible-playbook -i localhost, -e textstat_prefix=$PWD/.play/prefix tests/verify.yml

      - name: Count a file the role installed
        run: |
          mkdir -p .play
          { echo 'alpha beta'; echo 'gamma'; } > .play/sample.txt
          .play/prefix/bin/textstat .play/sample.txt
        continue-on-error: false

      - name: Assert a second run changes nothing
        run: |
          out=$(ansible-playbook -i localhost, -e textstat_prefix=$PWD/.play/prefix tests/playbook.yml)
          printf '%s\n' "$out" | tail -5
          printf '%s\n' "$out" | grep -q "changed=0"
