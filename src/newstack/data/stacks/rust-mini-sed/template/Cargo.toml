[package]
name = "{{ npm_name }}"
version = "0.1.0"
edition = "2024"
description = "{{ description }}"
license = "MIT"

[lib]
name = "{{ package_name }}"
path = "src/lib.rs"

[[bin]]
name = "{{ npm_name }}"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
