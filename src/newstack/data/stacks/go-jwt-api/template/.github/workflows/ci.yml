name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v1.10.1
        with:
          go-version: '1.24'
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o build/{{ npm_name }} .
      - name: Selftest
        run: ./build/{{ npm_name }} --selftest
      - name: Token contract
        run: |
          set -e
          work=$(mktemp -d)
          TOKEN_SECRET=ci-secret PORT=5455 ./build/{{ npm_name }} --db "$work/users.json" &
          server=$!
          trap 'kill -TERM $server 2>/dev/null || true; wait $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:5455/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          kill -0 $server
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"email":"ada@example.com","password":"correct horse"}' http://127.0.0.1:5455/register)" = 201
          token=$(curl -sS -X POST -H 'Content-Type: application/json' -d '{"email":"ada@example.com","password":"correct horse"}' http://127.0.0.1:5455/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:5455/me)" = 200
