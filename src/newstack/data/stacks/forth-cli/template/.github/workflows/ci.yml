name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gforth
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gforth
          gforth --version

      - name: Test
        run: sh tests/run_tests.sh

      - name: Help
        run: './bin/{{ npm_name }} --help | grep -qF "Usage: {{ npm_name }} [OPTION]... [FILE]..."'

      - name: Exit codes
        run: |
          set +e
          ./bin/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "usage error exit status: $status"
          test "$status" -eq 2
          ./bin/{{ npm_name }} nope.txt >/dev/null 2>&1
          status=$?
          echo "missing file exit status: $status"
          test "$status" -eq 1

      - name: Read stdin
        run: |
          set +e
          out=$(printf 'alpha beta\ngamma\n' | ./bin/{{ npm_name }} -w)
          status=$?
          echo "stdin: $out (status $status)"
          test "$status" -eq 0
          test "$out" = "3"

      - name: Matches wc on every input
        run: |
          set -eu
          mkdir -p .parity
          printf 'alpha beta\ngamma delta\n' > .parity/p1.txt
          printf 'alpha beta\ngamma' > .parity/p2.txt
          printf 'h\303\251llo w\303\266rld\n' > .parity/p3.txt
          : > .parity/p4.txt
          printf 'a\tb\vc\fd\n' > .parity/p5.txt
          for f in .parity/p*.txt; do
            ours=$(./bin/{{ npm_name }} -l -w -c "$f")
            theirs=$(wc -l -w -c "$f")
            echo "$f: $ours"
            test "$ours" = "$theirs"
          done
