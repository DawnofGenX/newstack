[package]
name = "{{ npm_name }}"
version = "0.1.0"
edition = "2024"
description = "{{ description }}"
license = "MIT"

[lib]
name = "{{ package_name }}"
path = "src/lib.rs"

[[bin]]
name = "{{ npm_name }}"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }