name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: install, test, typecheck, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Test
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Serve and curl
        run: |
          PORT=5413 bun run src/server.ts >.bun.log 2>&1 &
          server=$!
          ready=1
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5413/health >/dev/null 2>&1; then
              ready=0
              break
            fi
            sleep 0.5
          done
          if [ $ready -ne 0 ]; then
            cat .bun.log
            kill $server 2>/dev/null
            exit 1
          fi
          stats=$(curl -s 'http://127.0.0.1:5413/stats?text=hello%20world%0A')
          posted=$(curl -s -X POST -H 'content-type: application/json' --data-binary '{"text":"a b\nc\n"}' http://127.0.0.1:5413/stats)
          bad=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5413/stats)
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5413/nope)
          kill $server 2>/dev/null
          wait $server 2>/dev/null || true
          cat .bun.log
          printf '%s\n' "$stats" "$posted"
          printf '%s' "$stats" | grep -q '"lines":1'
          printf '%s' "$stats" | grep -q '"bytes":12'
          printf '%s' "$posted" | grep -q '"words":3'
          test "$bad" = 422
          test "$missing" = 404
