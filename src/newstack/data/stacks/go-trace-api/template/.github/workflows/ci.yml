name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: mkdir -p build && go build -o build/{{ npm_name }} .
      - run: ./build/{{ npm_name }} --selftest
      # The contract matters over a real socket: the child span's parent has to be
      # the span the response announced, and an unsampled trace must store nothing.
      - name: Contract over a real socket
        run: bash smoke.sh
