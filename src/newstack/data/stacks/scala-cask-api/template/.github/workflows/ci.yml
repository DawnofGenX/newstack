name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # scala-cli is a single binary, so pinning it here is the whole toolchain.
      - name: Install scala-cli
        run: |
          curl -sSLf -o scala-cli.gz \
            https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/scala-cli-x86_64-pc-linux.gz
          gzip -d scala-cli.gz
          chmod +x scala-cli
          sudo mv scala-cli /usr/local/bin/scala-cli
          scala-cli version
      - name: Format
        run: scala-cli fmt --check .
      - name: Test
        run: scala-cli test .
      - name: Package
        run: mkdir -p bin && scala-cli --power package . -o bin/server.jar --assembly -f
      - name: Serve
        run: |
          PORT=5419 java -jar bin/server.jar > .cask.log 2>&1 &
          server=$!
          ready=1
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5419/health >/dev/null 2>&1; then ready=0; break; fi
            sleep 0.5
          done
          if [ "$ready" != 0 ]; then
            cat .cask.log
            kill $server 2>/dev/null || true
            wait $server 2>/dev/null || true
            exit 1
          fi
          health=$(curl -fsS http://127.0.0.1:5419/health)
          stats=$(curl -fsS 'http://127.0.0.1:5419/stats?text=hello%20world%0A')
          posted=$(curl -fsS -X POST -H 'content-type: application/json' --data-binary '{"text":"a b\nc\n"}' http://127.0.0.1:5419/stats)
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5419/stats)
          gone=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5419/nope)
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:5419/health)
          kill $server 2>/dev/null || true
          wait $server 2>/dev/null || true
          test "$health" = '{"status":"ok"}'
          printf '%s' "$stats" | grep -q '"lines":1'
          printf '%s' "$stats" | grep -q '"bytes":12'
          printf '%s' "$posted" | grep -q '"words":3'
          test "$missing" = 422
          test "$gone" = 404
          test "$wrong" = 405
