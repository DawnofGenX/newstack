name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "{{ node_version }}"

      - name: Prepare {{ package_manager }}
        run: {{ package_manager_setup }}
      - name: Install dependencies
        run: {{ package_manager_install }}

      - name: Type check
        run: {{ package_manager_run }} typecheck

      - name: Test
        run: {{ package_manager_test }}

      - name: Build
        run: {{ package_manager_run }} build
