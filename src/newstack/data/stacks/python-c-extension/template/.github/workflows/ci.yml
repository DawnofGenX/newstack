name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the extension
        run: |
          uv venv --quiet --allow-existing .venv
          uv pip install --quiet --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: The import is the compiled module, not a fallback
        run: |
          .venv/bin/python - <<'PY'
          import {{ package_name }}

          shared = {{ package_name }}._speedups.__file__
          assert shared.endswith((".so", ".pyd")), shared
          print("compiled:", shared)
          PY
      - name: Contract
        run: PY=.venv/bin/python bash smoke.sh
