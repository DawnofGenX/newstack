name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: nimble test
      - name: Build
        run: nimble build -d:release
      - name: Serve and query
        run: |
          PORT=5415 ./{{ package_name }} >.nim.log 2>&1 &
          srv=$!
          ready=1
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5415/health >/dev/null 2>&1; then
              ready=0
              break
            fi
            sleep 0.5
          done
          if [ $ready -ne 0 ]; then
            cat .nim.log
            kill $srv 2>/dev/null
            exit 1
          fi
          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5415/health)
          stats=$(curl -s 'http://127.0.0.1:5415/stats?text=hello%20world%0A')
          posted=$(curl -s -X POST -H 'content-type: application/json' \
            --data-binary '{"text":"a b\nc\n"}' http://127.0.0.1:5415/stats)
          bad=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5415/stats)
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5415/nope)
          kill $srv 2>/dev/null
          wait $srv 2>/dev/null || true
          cat .nim.log
          test "$health" = 200
          printf '%s' "$stats" | grep -q '"lines":1'
          printf '%s' "$stats" | grep -q '"bytes":12'
          printf '%s' "$posted" | grep -q '"words":3'
          test "$bad" = 422
          test "$missing" = 404
