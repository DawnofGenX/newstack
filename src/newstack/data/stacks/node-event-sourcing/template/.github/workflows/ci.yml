name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # A fresh scaffold ships no lockfile, so `cache: npm` and `npm ci` would
      # both fail until you commit one.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Offline checks
        run: npm run selftest
      - name: The log contract over a real file
        run: bash smoke.sh
