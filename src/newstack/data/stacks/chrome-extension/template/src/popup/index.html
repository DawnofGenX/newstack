<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-width: 260px;
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.description {
        font-size: 12px;
        margin: 0 0 12px;
        opacity: 0.75;
      }
      #count {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        margin: 0 0 8px;
      }
      button {
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <h1>{{ title }}</h1>
    <p class="description">{{ description }}</p>
    <p id="count" aria-live="polite">Clicks: 0</p>
    <button id="increment" type="button">Increment</button>
    <button id="reset" type="button">Reset</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
