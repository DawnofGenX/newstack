<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        width: 350px;
        max-width: 100%;
        padding: 16px;
        font-size: 14px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p.description {
        font-size: 13px;
        margin: 0 0 12px;
        opacity: 0.75;
      }
      #count {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        margin: 0 0 4px;
      }
      #status {
        font-size: 12px;
        margin: 0 0 12px;
        opacity: 0.75;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      button {
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <p class="description">{{ description }}</p>
      <p id="count" aria-live="polite">Popup clicks: 0</p>
      <p id="status" aria-live="polite">Checking this page\u2026</p>
      <div class="actions">
        <button id="increment" type="button">Increment</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
