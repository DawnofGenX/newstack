name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install the project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e . pytest httpx ruff
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Streaming smoke test
        run: |
          set -euo pipefail
          uv run uvicorn {{ package_name }}.main:app --host 127.0.0.1 --port 5454 --log-level warning &
          server=$!
          trap 'kill -TERM -"$server" 2>/dev/null || kill -TERM "$server" 2>/dev/null || true; wait $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS --max-time 2 http://127.0.0.1:5454/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          kill -0 $server
          test "$(curl -sS -N --max-time 10 'http://127.0.0.1:5454/stream?count=3&delay=0.1' | grep -c 'event: tick')" = 3
          test "$(curl -sS -N --max-time 10 -H 'Last-Event-ID: 1' 'http://127.0.0.1:5454/stream?count=3&delay=0' | grep -c 'id: 1')" = 0
          test "$(curl -sS -N --max-time 10 'http://127.0.0.1:5454/stats/stream?text=a%20b%0Ac&size=2&delay=0' | grep -c 'event: chunk')" = 3
