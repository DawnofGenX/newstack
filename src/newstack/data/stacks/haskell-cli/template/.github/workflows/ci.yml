name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.7"
          cabal-version: "3.10.3.0"
      - name: Update the package index
        run: cabal update
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test all
      - name: Help exits 0
        run: ./bin/{{ npm_name }} --help
      - name: Version exits 0
        run: ./bin/{{ npm_name }} --version
      - name: Usage error exits 2
        run: |
          set +e
          ./bin/{{ npm_name }} --bogus > /dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 2
      - name: Missing file exits 1
        run: |
          set +e
          ./bin/{{ npm_name }} does-not-exist.txt > /dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 1
      - name: Figures match wc
        run: |
          printf 'alpha beta\ngamma delta\n' > .wc1.txt
          printf 'no trailing newline' > .wc2.txt
          printf 'h\303\251llo w\303\266rld\n' > .wc3.txt
          : > .wc4.txt
          for file in .wc1.txt .wc2.txt .wc3.txt .wc4.txt; do
            ours=$(./bin/{{ npm_name }} -l -w -c "$file" | awk '{print $1, $2, $3}')
            theirs=$(wc -l -w -c "$file" | awk '{print $1, $2, $3}')
            if [ "$ours" != "$theirs" ]; then
              echo "MISMATCH $file: ours=[$ours] theirs=[$theirs]"
              exit 1
            fi
          done
          rm -f .wc1.txt .wc2.txt .wc3.txt .wc4.txt
          echo "parity ok"
