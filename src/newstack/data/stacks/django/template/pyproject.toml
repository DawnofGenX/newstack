[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "{{ npm_name }}"
version = "0.1.0"
description = "{{ description }}"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "{{ author }}", email = "{{ email }}" }]
dependencies = ["django>=6.1"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.14", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["config", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations are generated code: their module-level lists trip RUF012
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Pin the rule set: ruff's defaults shift between releases, which makes the same
# template lint clean in one environment and dirty in another.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
