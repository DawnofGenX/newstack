name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # No lockfile is shipped with a fresh scaffold, so `cache: npm` and `npm ci`
      # would both fail here: they require a committed package-lock.json. Run
      # `npm install` once and commit the lockfile, then you can switch to `npm ci`
      # and re-add `cache: npm` for reproducible, cached installs.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
