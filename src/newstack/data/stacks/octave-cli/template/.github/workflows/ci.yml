name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave
          octave --version | head -1

      - name: Test
        run: octave --no-window-system --quiet tests/run_tests.m

      - name: Help
        run: './bin/{{ npm_name }} --help | grep -q "Usage: {{ npm_name }}"'

      - name: Exit codes
        run: |
          set +e
          ./bin/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "usage error exit status: $status"
          test "$status" -eq 2 || exit 1
          ./bin/{{ npm_name }} /nonexistent/file.txt >/dev/null 2>&1
          status=$?
          echo "missing file exit status: $status"
          test "$status" -eq 1 || exit 1

      - name: Read standard input
        run: |
          set +e
          out=$(printf 'alpha beta\ngamma\n' | ./bin/{{ npm_name }} -w)
          status=$?
          echo "output: $out"
          test "$status" -eq 0 || exit 1
          test "$out" = "3 -" || exit 1

      - name: Matches wc on every input
        run: |
          set -eu
          mkdir -p .parity
          printf 'alpha beta\ngamma delta\n' > .parity/p1.txt
          printf 'one two three' > .parity/p2.txt
          printf 'h\303\251llo w\303\266rld\n' > .parity/p3.txt
          : > .parity/p4.txt
          printf 'a\tb\vc\fd\n' > .parity/p5.txt
          for file in .parity/p*.txt; do
            ours=$(./bin/{{ npm_name }} -l -w -c "$file" | awk '{print $1, $2, $3}')
            theirs=$(wc -l -w -c < "$file" | awk '{print $1, $2, $3}')
            echo "$file ours=$ours wc=$theirs"
            test "$ours" = "$theirs"
          done
