name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The smoke client is dig, not a test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsutils
      - name: Install
        run: |
          uv venv --quiet --allow-existing .venv --python ${{ matrix.python-version }}
          uv pip install --quiet --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Self-check
        run: .venv/bin/python -m {{ package_name }} --selftest
      - name: Contract over a real socket
        run: PY=.venv/bin/python bash smoke.sh
