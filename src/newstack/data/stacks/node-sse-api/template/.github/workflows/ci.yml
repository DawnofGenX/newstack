name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # No lockfile ships with a fresh scaffold, so {{ package_manager_ci }} and
      # `cache: {{ package_manager }}` would both fail until you commit one.
      - name: Prepare {{ package_manager }}
        run: {{ package_manager_setup }}
      - run: {{ package_manager_install }}
      - run: {{ package_manager_test }}
      - name: Streaming contract over a real socket
        # An SSE stream only exists over a socket, so this step starts the
        # server and lets tools/contract.mjs do the assertions.
        env:
          # Short heartbeat so the contract can observe one without waiting 15s.
          SSE_HEARTBEAT_MS: "200"
        run: |
          if curl -s --max-time 2 http://127.0.0.1:5469/health >/dev/null 2>&1; then
            echo "port 5469 is already answering - stop that process before running this step"
            exit 1
          fi
          PORT=5469 node src/main.js >.node-sse.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true; wait $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -s --max-time 2 http://127.0.0.1:5469/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          kill -0 $server
          node tools/contract.mjs --base http://127.0.0.1:5469 --expect-heartbeat
