name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Self-check the modules
        run: node src/main.js --selftest
      - name: Unit tests
        run: {{ package_manager_test }}
      - name: Contract over a real h2c session
        run: bash smoke.sh
