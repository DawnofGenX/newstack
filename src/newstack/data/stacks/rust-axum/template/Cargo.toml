[package]
name = "{{ npm_name }}"
description = "{{ description }}"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["{{ author }} <{{ email }}>"]

[lib]
name = "{{ package_name }}"
path = "src/lib.rs"

[[bin]]
name = "{{ npm_name }}"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
