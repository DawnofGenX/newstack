# Local plugins, not remote ones: `buf generate` runs the two binaries that `go install`
# put on PATH, so codegen works offline and its versions are pinned in the README and CI.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
