name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf and the protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.61.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint the contract
        run: buf lint

      - name: Generate the stubs
        run: buf generate

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Serve and probe over a real socket
        run: |
          go build -o bin/server ./cmd/{{ npm_name }}
          go build -o bin/probe ./cmd/probe
          PORT=50071 ./bin/server >.grpc.log 2>&1 &
          server=$!
          ready=1
          for _ in $(seq 1 60); do
            if ./bin/probe -addr 127.0.0.1:50071 >.probe.out 2>/dev/null; then
              ready=0
              break
            fi
            sleep 0.5
          done
          if [ $ready -ne 0 ]; then
            cat .grpc.log .probe.out 2>/dev/null
            kill $server 2>/dev/null
            exit 1
          fi
          ./bin/probe -addr 127.0.0.1:50071 -text 'a b\nc\n' >.probe2.out 2>&1
          kill $server 2>/dev/null
          wait $server 2>/dev/null
          cat .probe.out .probe2.out
          grep -q 'lines=1 words=2 bytes=12' .probe.out
          grep -q 'lines=2 words=3 bytes=6' .probe2.out
