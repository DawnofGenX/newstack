name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare {{ package_manager }}
        run: {{ package_manager_setup }}
      - name: Install dependencies
        run: {{ package_manager_install }}
      - name: Type check
        run: {{ package_manager_run }} check
      - name: Test
        run: {{ package_manager_test }}
      - name: Build
        run: {{ package_manager_run }} build
