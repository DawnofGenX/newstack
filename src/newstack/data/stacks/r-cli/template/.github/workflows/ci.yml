name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install R
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends r-base-core
      - name: Show version
        run: Rscript --version
      - name: Test
        run: Rscript tests/run.R
      - name: Help
        run: Rscript bin/{{ npm_name }} --help
      - name: Usage error exits 2
        run: |
          set +e
          Rscript bin/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 2
      - name: Missing file exits 1
        run: |
          set +e
          Rscript bin/{{ npm_name }} does-not-exist.txt >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 1
