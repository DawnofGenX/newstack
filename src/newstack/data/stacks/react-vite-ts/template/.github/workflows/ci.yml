name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare {{ package_manager }}
        run: {{ package_manager_setup }}
      # No lockfile is shipped with a fresh scaffold, so `cache: {{ package_manager }}`
      # and `{{ package_manager_ci }}` would both fail here: they require a committed
      # {{ package_manager_lock }}. Run `{{ package_manager_install }}` once and commit
      # the lockfile, then you can switch to `{{ package_manager_ci }}` and re-add
      # `cache: {{ package_manager }}` for reproducible, cached installs.
      - run: {{ package_manager_install }}
      - run: {{ package_manager_run }} typecheck
      - run: {{ package_manager_test }}
      - run: {{ package_manager_run }} build
