name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv venv --quiet && uv pip install --quiet --python .venv/bin/python -e . pytest ruff
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/python -m pytest
      - name: Self-test
        run: .venv/bin/python -m {{ package_name }} selftest
      - name: Smoke (golden report)
        run: PY=.venv/bin/python bash smoke.sh
