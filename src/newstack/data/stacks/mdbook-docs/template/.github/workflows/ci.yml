name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          if ! command -v mdbook >/dev/null 2>&1; then
            curl -sSLf -o /tmp/mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
            tar -xzf /tmp/mdbook.tar.gz -C /tmp
            sudo install -m755 /tmp/mdbook /usr/local/bin/mdbook
          fi
          mdbook --version

      - name: Check links and the summary
        run: ./tools/check-links.sh

      - name: Run the suites
        run: ./tests/run_tests.sh

      - name: Build the book
        run: make -s build

      - name: The built site is real
        run: |
          test -f book/index.html
          test -f book/guide/writing.html
          grep -qF 'Write a page' book/guide/writing.html
