name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore --nologo
      - name: Build
        run: dotnet build --nologo --no-restore
      - name: Test
        run: dotnet test --nologo --no-build
      - name: CLI smoke
        run: dotnet run --project src/{{ npm_name }}.Cli --no-build -- --help
