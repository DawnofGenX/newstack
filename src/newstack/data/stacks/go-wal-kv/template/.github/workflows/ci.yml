name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: "mkdir -p build && go build -o build/{{ npm_name }} ."
      - run: "./build/{{ npm_name }} --selftest"
      - run: bash smoke.sh
