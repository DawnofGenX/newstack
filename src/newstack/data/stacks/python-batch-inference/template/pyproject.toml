[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ npm_name }}"
version = "0.1.0"
description = "Resumable batch inference over an OpenAI-compatible endpoint"
requires-python = ">={{ python_version }}"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13"]

[project.scripts]
{{ npm_name }} = "{{ package_name }}.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ package_name }}"]

[tool.ruff]
line-length = 100
target-version = "py{{ python_tag }}"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
