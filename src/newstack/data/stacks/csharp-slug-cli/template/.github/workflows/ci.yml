name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore --nologo
      - name: Build
        run: dotnet build -c Release --nologo --no-restore -warnaserror
      - name: Test
        run: dotnet test -c Release --nologo --no-build
