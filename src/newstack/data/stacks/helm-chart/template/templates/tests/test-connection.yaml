{{/*
The chart's own test: `helm test <release>` runs this pod, which curls the
Service. Hooks annotated helm.sh/hook: test are never part of a normal install,
so this costs nothing until someone asks for it.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "{{ npm_name }}.fullname" . }}-test-connection
  labels:
    {{- include "{{ npm_name }}.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-qO-"
        - "http://{{ include "{{ npm_name }}.fullname" . }}:{{ .Values.service.port }}/healthz"
