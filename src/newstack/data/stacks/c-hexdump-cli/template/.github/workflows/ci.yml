name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          if ! command -v cc >/dev/null || ! command -v make >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          fi
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Smoke
        run: |
          out=$(printf 'Hello\n' | ./build/{{ npm_name }})
          if [ "$out" != "00000000  48 65 6c 6c 6f 0a                                 |Hello.          |" ]; then
            echo "unexpected dump: [$out]"
            exit 1
          fi
      - name: Usage error exits 2
        run: |
          set +e
          ./build/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 2
      - name: Missing file exits 1
        run: |
          set +e
          ./build/{{ npm_name }} /nonexistent-file-xyz >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 1