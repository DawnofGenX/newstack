[package]
name = "{{ npm_name }}"
version = "0.1.0"
description = "{{ description }}"
edition = "2021"

[lib]
name = "{{ package_name }}"
path = "src/lib.rs"

[[bin]]
name = "{{ npm_name }}"
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
