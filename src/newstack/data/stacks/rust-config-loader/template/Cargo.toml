[package]
name = "{{ npm_name }}"
version = "0.1.0"
edition = "2024"
description = "{{ description }}"
license = "MIT"

[lib]
name = "{{ package_name }}"
path = "src/lib.rs"

[[bin]]
name = "{{ npm_name }}"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"