name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [{{ node_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # No lockfile ships with a fresh scaffold, so `cache: {{ package_manager }}`
      # and `{{ package_manager_ci }}` would both fail until you commit one.
      - name: Prepare {{ package_manager }}
        run: {{ package_manager_setup }}
      - run: {{ package_manager_install }}
      - run: {{ package_manager_run }} build
      - run: {{ package_manager_test }}
      - name: Serve the built bundle and assert it
        run: |
          if curl -fsS --max-time 2 http://127.0.0.1:5461/ >/dev/null 2>&1; then
            echo "port 5461 is already answering - stop that process before running this step"
            exit 1
          fi
          PORT=5461 node tools/serve.mjs dist/{{ npm_name }}/browser >.angular-http.log 2>&1 &
          server=$!
          set -e
          trap 'kill -TERM $server 2>/dev/null || true; wait $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:5461/ >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          kill -0 $server
          index=$(curl -fsS --max-time 2 http://127.0.0.1:5461/)
          case "$index" in *"<app-root"*) ;; *) echo "index.html is not the app"; exit 1 ;; esac
          bundle=$(printf '%s' "$index" | sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' | head -1)
          test -n "$bundle"
          case "$bundle" in /*) ;; *) bundle="/$bundle" ;; esac
          curl -fsS --max-time 5 "http://127.0.0.1:5461$bundle" | grep -Fq 'Text stats'
          curl -fsS --max-time 2 http://127.0.0.1:5461/some/client/route | grep -Fq '<app-root'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:5461/missing.js)" = 404
