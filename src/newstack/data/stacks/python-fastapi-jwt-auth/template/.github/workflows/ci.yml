name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.12
      - run: uv venv --allow-existing .venv && uv pip install -e . pytest httpx ruff
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python -m {{ package_name }} --selftest