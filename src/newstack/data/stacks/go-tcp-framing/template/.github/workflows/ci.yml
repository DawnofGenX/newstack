name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
      - name: Self-check
        run: |
          mkdir -p build
          go build -o build/{{ npm_name }} .
          ./build/{{ npm_name }} --selftest
      - name: Contract over a real socket
        run: bash smoke.sh
