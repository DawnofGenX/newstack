name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check PowerShell
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -sSLf -o /tmp/pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-linux-x64.tar.gz
            sudo mkdir -p /opt/microsoft/powershell/7
            sudo tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
            sudo chmod +x /opt/microsoft/powershell/7/pwsh
            sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          fi
          pwsh --version

      - name: Test
        run: pwsh -NoProfile -NonInteractive -File tests/Run-Tests.ps1

      - name: Help
        run: |
          ./bin/{{ npm_name }} --help | grep -qF 'Usage: {{ npm_name }} [OPTION]... [FILE]...'

      - name: Usage error
        run: |
          set +e
          ./bin/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 2

      - name: Missing file
        run: |
          set +e
          ./bin/{{ npm_name }} /nonexistent/file.txt >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 1

      - name: Standard input
        run: |
          test "$(printf 'alpha beta\ngamma\n' | ./bin/{{ npm_name }} -w)" = '3'
          test "$(printf 'alpha beta\ngamma\n' | ./bin/{{ npm_name }} -w -)" = '3 -'
          test "$(printf 'alpha beta\ngamma delta\n' | ./bin/{{ npm_name }})" = '      2       4      23'

      - name: Matches wc
        run: |
          mkdir -p .parity
          printf 'alpha beta\ngamma delta\n' > .parity/p1.txt
          printf 'alpha beta\ngamma' > .parity/p2.txt
          printf 'h\303\251llo w\303\266rld\n' > .parity/p3.txt
          : > .parity/p4.txt
          printf 'a\tb\vc\fd\n' > .parity/p5.txt
          for file in .parity/p*.txt; do
            ours=$(./bin/{{ npm_name }} "$file")
            theirs=$(wc "$file")
            echo "$file ours=[$ours] wc=[$theirs]"
            test "$ours" = "$theirs"
          done
