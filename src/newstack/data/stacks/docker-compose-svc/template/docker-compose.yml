services:
  web:
    build: .
    image: {{ npm_name }}:dev
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      LOG_REQUESTS: "${LOG_REQUESTS:-1}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; socket.create_connection(('127.0.0.1', int(os.environ['PORT'])), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    restart: unless-stopped
