name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave curl
          octave --version | head -1
      - name: Self test
        run: octave --no-window-system --quiet tests/run_tests.m
      - name: HTTP contract
        run: |
          set -e
          PORT=5450 ./bin/{{ npm_name }} > .octave-http.log 2>&1 &
          server=$!
          trap 'kill -TERM $server 2>/dev/null || true; for _ in $(seq 1 20); do kill -0 $server 2>/dev/null || break; sleep 0.1; done; kill -KILL $server 2>/dev/null || true; wait $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 160); do
            if curl --max-time 2 -fsS http://127.0.0.1:5450/health > /dev/null 2>&1; then break; fi
            sleep 0.25
          done
          kill -0 $server 2>/dev/null || { cat .octave-http.log; exit 1; }
          test "$(curl --max-time 10 -fsS http://127.0.0.1:5450/health)" = '{"status":"ok"}'
          test "$(curl --max-time 10 -fsS 'http://127.0.0.1:5450/stats?text=hello%20world%0A')" \
            = '{"text":"hello world\n","lines":1,"words":2,"bytes":12}'
          test "$(curl --max-time 10 -s -o /dev/null -w '%{http_code}' -X POST --data-binary '{"text":1}' http://127.0.0.1:5450/stats)" = 422
