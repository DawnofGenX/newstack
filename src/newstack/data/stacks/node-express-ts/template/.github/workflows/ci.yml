name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # no lockfile is shipped yet: run `npm install` once locally and commit
      # package-lock.json, then switch this to `npm ci` for reproducible installs
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
