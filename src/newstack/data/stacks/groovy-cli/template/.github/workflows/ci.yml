name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Groovy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends groovy
          groovy --version

      - name: Test
        run: groovy -cp src:tests tests/run_tests.groovy

      - name: Help
        run: './bin/{{ npm_name }} --help | grep -qF "Usage: {{ npm_name }} [OPTION]... [FILE]..."'

      - name: Exit codes
        run: |
          set +e
          ./bin/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "unknown option exit status: $status"
          test "$status" -eq 2
          ./bin/{{ npm_name }} /nonexistent/file.txt >/dev/null 2>&1
          status=$?
          echo "missing file exit status: $status"
          test "$status" -eq 1

      - name: Read stdin
        run: |
          test "$(printf 'alpha beta\ngamma\n' | ./bin/{{ npm_name }} -w)" = '3'
          test "$(printf 'alpha beta\ngamma\n' | ./bin/{{ npm_name }} -w -)" = '3 -'
          test "$(printf 'alpha beta\ngamma delta\n' | ./bin/{{ npm_name }})" = '      2       4      23'

      - name: Matches wc on every input
        run: |
          mkdir -p .parity
          printf 'alpha beta\ngamma delta\n' > .parity/p1.txt
          printf 'alpha beta\ngamma' > .parity/p2.txt
          printf 'h\303\251llo w\303\266rld\n' > .parity/p3.txt
          : > .parity/p4.txt
          printf 'a\tb\vc\fd\n' > .parity/p5.txt
          for file in .parity/p*.txt; do
            ours=$(./bin/{{ npm_name }} "$file" | awk '{print $1, $2, $3}')
            theirs=$(wc -l -w -c < "$file" | awk '{print $1, $2, $3}')
            echo "$file ours=[$ours] wc=[$theirs]"
            test "$ours" = "$theirs"
          done
