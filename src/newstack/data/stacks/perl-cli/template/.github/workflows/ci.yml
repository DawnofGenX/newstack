name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          perl -c -Ilib bin/{{ npm_name }}
          perl -c -Ilib lib/Textstat.pm
          perl -c -Ilib lib/Textstat/Counts.pm
          perl -c -Ilib lib/Textstat/Options.pm
      - name: Configure
        run: perl Makefile.PL
      - name: Test
        run: make test
      - name: Smoke test the CLI
        run: |
          set +e
          printf 'one two\nthree\n' > sample.txt
          perl bin/{{ npm_name }} --help >/dev/null; help=$?
          counted=$(perl bin/{{ npm_name }} -w sample.txt); counted_status=$?
          perl bin/{{ npm_name }} --bogus >/dev/null 2>&1; usage=$?
          perl bin/{{ npm_name }} does-not-exist.txt >/dev/null 2>&1; missing=$?
          printf 'help=%s counted=%s status=%s usage=%s missing=%s\n' \
            "$help" "$counted" "$counted_status" "$usage" "$missing"
          test "$help" -eq 0
          test "$counted_status" -eq 0
          test "$(printf '%s' "$counted" | awk '{print $1}')" = "3"
          test "$usage" -eq 2
          test "$missing" -eq 1
