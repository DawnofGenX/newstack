[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ npm_name }}"
version = "0.1.0"
description = "{{ description }}"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "{{ author }}", email = "{{ email }}" }]
dependencies = ["pytest>=8.3"]

[project.scripts]
{{ npm_name }} = "{{ package_name }}.cli:main"

# A pytest plugin is only a plugin because of this entry point: `pip install -e .`
# makes pytest load it, and no amount of `conftest.py` substitutes for it.
[project.entry-points.pytest11]
"{{ npm_name }}" = "{{ package_name }}.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ package_name }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
