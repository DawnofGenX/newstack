name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-tools
      - name: Install
        run: |
          uv venv --quiet --allow-existing .venv
          uv pip install --quiet --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Self-checks over a real socket
        run: .venv/bin/python -m {{ package_name }} --selftest
      - name: Contract with redis-cli
        run: PY=.venv/bin/python bash smoke.sh
