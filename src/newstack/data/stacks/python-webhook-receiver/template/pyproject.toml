[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ npm_name }}"
version = "0.1.0"
description = "{{ description }}"
requires-python = ">={{ python_version }}"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py{{ python_tag }}"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ package_name }}"]
