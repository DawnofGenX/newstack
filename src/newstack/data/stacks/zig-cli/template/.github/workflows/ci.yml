name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Test
        run: zig build test
      - name: Build
        run: zig build
