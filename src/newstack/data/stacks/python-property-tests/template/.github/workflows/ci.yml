name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e . hypothesis pytest ruff
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/python -m pytest
      - name: Smoke
        run: PY=.venv/bin/python bash smoke.sh
