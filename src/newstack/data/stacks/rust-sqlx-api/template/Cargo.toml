[package]
name = "{{ npm_name }}"
version = "0.1.0"
edition = "2021"
description = "{{ description }}"
license = "MIT"

[lib]
name = "{{ package_name }}"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
