name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install the project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e . pytest httpx ruff
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Scheduler contract over a real socket
        run: |
          set -euo pipefail
          if curl -fsS --max-time 2 http://127.0.0.1:5457/health >/dev/null 2>&1; then
            echo "port 5457 is already answering - stop that process before running this step"
            exit 1
          fi
          work=$(mktemp -d)
          uv run uvicorn {{ package_name }}.main:app --host 127.0.0.1 --port 5457 --log-level warning &
          server=$!
          trap 'kill -TERM -"$server" 2>/dev/null || kill -TERM "$server" 2>/dev/null || true; wait $server 2>/dev/null || true; rm -rf "$work"' EXIT
          for _ in $(seq 1 60); do
            curl -fsS --max-time 2 http://127.0.0.1:5457/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          kill -0 $server
          base=http://127.0.0.1:5457
          # A one-shot job that is due in 2099 runs when its owner asks it to.
          id=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"name":"digest","payload":"a b\nc\n","run_at":9999999999}' "$base/jobs" \
            | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$id"
          curl -fsS -X POST "$base/jobs/$id/run" >/dev/null
          for _ in $(seq 1 100); do
            state=$(curl -fsS "$base/jobs/$id" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            [ "$state" = "done" ] && break
            sleep 0.1
          done
          test "$state" = "done"
          curl -fsS "$base/jobs/$id/runs" | grep -q '"words":3'
          # A failing job stops after max_attempts instead of spinning.
          boom=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"name":"boom","kind":"explode","max_attempts":2}' "$base/jobs" \
            | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          for _ in $(seq 1 200); do
            state=$(curl -fsS "$base/jobs/$boom" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            [ "$state" = "failed" ] && break
            sleep 0.1
          done
          test "$state" = "failed"
          curl -fsS "$base/jobs/$boom" | grep -q '"attempts":2'
