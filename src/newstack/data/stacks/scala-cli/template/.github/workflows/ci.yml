name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # scala-cli is a single binary, so pinning it here is the whole toolchain.
      - name: Install scala-cli
        run: |
          curl -sSLf -o scala-cli.gz \
            https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/scala-cli-x86_64-pc-linux.gz
          gzip -d scala-cli.gz
          chmod +x scala-cli
          sudo mv scala-cli /usr/local/bin/scala-cli
          scala-cli version
      - name: Compile
        run: scala-cli compile . --server=false
      - name: Test
        run: scala-cli test . --server=false
      - name: Help
        run: ./bin/{{ npm_name }} --help
      - name: Usage error exits 2
        run: |
          set +e
          ./bin/{{ npm_name }} --bogus >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 2
      - name: Missing file exits 1
        run: |
          set +e
          ./bin/{{ npm_name }} does-not-exist.txt >/dev/null 2>&1
          status=$?
          echo "exit status: $status"
          test "$status" -eq 1
