name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{{ python_versions }}]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install the project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e . pytest httpx ruff
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Offline contract check
        run: uv run python -m {{ package_name }} --selftest
      - name: Contract through curl
        run: bash smoke.sh
