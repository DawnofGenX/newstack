name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  stacks:
    name: stack ${{ matrix.stack }} is green
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - python-lib
          - python-cli
          - fastapi
          - django
          - flask
          - data-science
          - node-express-ts
          - react-vite-ts
          - vue-vite-ts
          - next-app-ts
          - chrome-extension
          - astro
          - svelte-kit-ts
          - go-cli
          - go-http
          - rust-cli
          - rust-axum
          - cpp-cmake-cli
          - terraform-module
          - ruby-sinatra
          - java-maven-cli
          - php-composer-cli
          - symfony-app
          - csharp-cli
          - elixir-mix-cli
          - dart-cli
          - kotlin-cli
          - zig-cli
          - julia-cli
          - nim-cli
          - perl-cli
          - lua-cli
          - fsharp-cli
          - crystal-cli
          - bun-cli
          - r-cli
          - ocaml-cli
          - static-site
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Go
        if: matrix.stack == 'go-cli'
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Set up Rust
        if: matrix.stack == 'rust-cli'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Set up Terraform
        if: matrix.stack == 'terraform-module'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - name: Set up Ruby
        if: matrix.stack == 'ruby-sinatra'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Set up Java
        if: contains(fromJSON('["java-maven-cli","kotlin-cli"]'), matrix.stack)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up PHP
        if: contains(fromJSON('["php-composer-cli","symfony-app"]'), matrix.stack)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, mbstring, xml
          coverage: none
      - name: Set up .NET
        if: contains(fromJSON('["csharp-cli","fsharp-cli"]'), matrix.stack)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up Elixir
        if: matrix.stack == 'elixir-mix-cli'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Set up Dart
        if: matrix.stack == 'dart-cli'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.7"
      - name: Set up Zig
        if: matrix.stack == 'zig-cli'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - name: Set up OCaml
        if: matrix.stack == 'ocaml-cli'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.1"
      - name: Set up Julia
        if: matrix.stack == 'julia-cli'
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - name: Set up Nim
        if: matrix.stack == 'nim-cli'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
      - name: Install Lua
        if: matrix.stack == 'lua-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -v
      - name: Install Crystal
        if: matrix.stack == 'crystal-cli'
        uses: crystal-lang/install-crystal@v1.9.5
        with:
          crystal: "1.11"
      - name: Set up Bun
        if: matrix.stack == 'bun-cli'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install R
        if: matrix.stack == 'r-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends r-base-core
          Rscript --version
      - name: Install newstack
        run: uv sync --group dev
      - name: Generate and verify the stack
        run: uv run newstack check ${{ matrix.stack }} --verbose

  package:
    name: wheel ships the stacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/pkg --python 3.12
          uv pip install --python /tmp/pkg/bin/python dist/*.whl
      - name: List stacks from the installed wheel
        run: /tmp/pkg/bin/newstack list
      - name: Generate a project with the installed wheel
        run: |
          /tmp/pkg/bin/newstack new python-lib /tmp/smoke-lib --name smoke_lib --no-git
          test -f /tmp/smoke-lib/src/smoke_lib/core.py
          test -f /tmp/smoke-lib/.github/workflows/ci.yml
      - name: The generated project passes its own tests
        run: |
          uv venv /tmp/smoke-env --python 3.12
          uv pip install --python /tmp/smoke-env/bin/python -e /tmp/smoke-lib pytest
          cd /tmp/smoke-lib && /tmp/smoke-env/bin/python -m pytest -q
