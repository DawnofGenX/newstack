name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  stacks:
    name: stack ${{ matrix.stack }} is green
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - python-lib
          - python-cli
          - fastapi
          - django
          - flask
          - data-science
          - node-express-ts
          - react-vite-ts
          - vue-vite-ts
          - next-app-ts
          - chrome-extension
          - astro
          - svelte-kit-ts
          - go-cli
          - go-http
          - rust-cli
          - rust-axum
          - cpp-cmake-cli
          - terraform-module
          - ansible-role
          - ruby-sinatra
          - rails-app
          - java-maven-cli
          - spring-boot
          - php-composer-cli
          - symfony-app
          - csharp-cli
          - dotnet-cli
          - elixir-mix-cli
          - dart-cli
          - kotlin-cli
          - zig-cli
          - julia-cli
          - nim-cli
          - perl-cli
          - lua-cli
          - fsharp-cli
          - crystal-cli
          - bun-cli
          - r-cli
          - ocaml-cli
          - static-site
          - helm-chart
          - gleam-cli
          - scala-cli
          - haskell-cli
          - clojure-cli
          - swift-cli
          - tcl-cli
          - erlang-cli
          - racket-cli
          - deno-cli
          - vhdl-sim
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Go
        if: matrix.stack == 'go-cli'
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Set up Rust
        if: matrix.stack == 'rust-cli'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Set up Terraform
        if: matrix.stack == 'terraform-module'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      # The role pins nothing but ansible-core; `uv tool install` is the fastest
      # way to get a modern ansible-playbook onto the runner's PATH.
      - name: Install ansible-core
        if: matrix.stack == 'ansible-role'
        run: |
          uv tool install --quiet ansible-core
          ansible-playbook --version
      - name: Set up Ruby
        if: contains(fromJSON('["ruby-sinatra","rails-app"]'), matrix.stack)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Set up Java
        if: contains(fromJSON('["java-maven-cli","kotlin-cli","spring-boot"]'), matrix.stack)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # GHC and cabal come from haskell-actions/setup, which also puts both on
      # PATH; cabal still needs an index before it can resolve a build plan.
      - name: Set up GHC and cabal
        if: matrix.stack == 'haskell-cli'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.7"
          cabal-version: "3.10.3.0"
      - name: Update the cabal package index
        if: matrix.stack == 'haskell-cli'
        run: cabal update
      # scala-cli is one binary, so installing it is the whole toolchain; no
      # Maven cache here because there is no pom (scala-cli fetches its own deps).
      - name: Set up Java (scala-cli)
        if: matrix.stack == 'scala-cli'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install scala-cli
        if: matrix.stack == 'scala-cli'
        run: |
          curl -sSLf -o scala-cli.gz https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/scala-cli-x86_64-pc-linux.gz
          gzip -d scala-cli.gz
          chmod +x scala-cli
          sudo mv scala-cli /usr/local/bin/scala-cli
          scala-cli version
      # The Clojure CLI is a launcher script plus a lib dir; the release tag is
      # the version, so this installs 1.12.6 exactly. (The DeLaGuardo action
      # only publishes bare numeric tags, which the repo's pinning rule rejects.)
      - name: Set up Java (clojure-cli)
        if: matrix.stack == 'clojure-cli'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Clojure CLI
        if: matrix.stack == 'clojure-cli'
        run: |
          curl -sSLf -o linux-install.sh https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure -Sdescribe
      # Swift ships as a toolchain tarball in swift.org; the action installs the
      # pinned release and puts `swift` on PATH. No package dependencies, so
      # nothing to resolve over the network.
      - name: Set up Swift
        if: matrix.stack == 'swift-cli'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Install GHDL
        if: matrix.stack == 'vhdl-sim'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghdl
          ghdl --version | head -1

      - name: Set up Deno
        if: matrix.stack == 'deno-cli'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Racket
        if: matrix.stack == 'racket-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends racket
          racket --version

      - name: Install Erlang
        if: matrix.stack == 'erlang-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends erlang-nox erlang-dev make
          erl -noshell -eval 'io:format("~s~n", [erlang:system_info(otp_release)]), halt().'

      - name: Install Tcl
        if: matrix.stack == 'tcl-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl
          echo 'puts [info patchlevel]' | tclsh

      - name: Set up PHP
        if: contains(fromJSON('["php-composer-cli","symfony-app"]'), matrix.stack)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, mbstring, xml
          coverage: none
      - name: Set up .NET
        if: contains(fromJSON('["csharp-cli","fsharp-cli","dotnet-cli"]'), matrix.stack)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up Elixir
        if: matrix.stack == 'elixir-mix-cli'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Set up Dart
        if: matrix.stack == 'dart-cli'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.7"
      - name: Set up Zig
        if: matrix.stack == 'zig-cli'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - name: Set up OCaml
        if: matrix.stack == 'ocaml-cli'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.1"
          dune-cache: true
      # setup-ocaml leaves dune off PATH for later steps, and `newstack check`
      # needs `dune` resolvable to build the generated project.
      - name: Put dune on PATH
        if: matrix.stack == 'ocaml-cli'
        run: |
          opam install --yes dune
          echo "$(opam var bin)" >> "$GITHUB_PATH"
      - name: Set up Helm
        if: matrix.stack == 'helm-chart'
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Set up Gleam
        if: matrix.stack == 'gleam-cli'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          gleam-version: 1.19.2
      - name: Set up Julia
        if: matrix.stack == 'julia-cli'
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - name: Set up Nim
        if: matrix.stack == 'nim-cli'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
      - name: Install Lua
        if: matrix.stack == 'lua-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -v
      - name: Install Crystal
        if: matrix.stack == 'crystal-cli'
        uses: crystal-lang/install-crystal@v1.9.5
        with:
          crystal: "1.11"
      - name: Set up Bun
        if: matrix.stack == 'bun-cli'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install R
        if: matrix.stack == 'r-cli'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends r-base-core
          Rscript --version
      - name: Install newstack
        run: uv sync --group dev
      - name: Generate and verify the stack
        run: uv run newstack check ${{ matrix.stack }} --verbose

  package:
    name: wheel ships the stacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/pkg --python 3.12
          uv pip install --python /tmp/pkg/bin/python dist/*.whl
      - name: List stacks from the installed wheel
        run: /tmp/pkg/bin/newstack list
      - name: Generate a project with the installed wheel
        run: |
          /tmp/pkg/bin/newstack new python-lib /tmp/smoke-lib --name smoke_lib --no-git
          test -f /tmp/smoke-lib/src/smoke_lib/core.py
          test -f /tmp/smoke-lib/.github/workflows/ci.yml
      - name: The generated project passes its own tests
        run: |
          uv venv /tmp/smoke-env --python 3.12
          uv pip install --python /tmp/smoke-env/bin/python -e /tmp/smoke-lib pytest
          cd /tmp/smoke-lib && /tmp/smoke-env/bin/python -m pytest -q
