[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newstack"
version = "0.4.0"
description = "Scaffold a new project on any popular stack — every generated starter is proven green in CI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Priyansh Kansara", email = "pkansara0412@gmail.com" }]
keywords = ["scaffold", "scaffolding", "boilerplate", "template", "generator", "cli", "starter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
newstack = "newstack.cli:main"

[project.urls]
Homepage = "https://github.com/DawnofGenX/newstack"
Repository = "https://github.com/DawnofGenX/newstack"
Issues = "https://github.com/DawnofGenX/newstack/issues"
Changelog = "https://github.com/DawnofGenX/newstack/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/newstack"]

[tool.hatch.build.targets.sdist]
include = ["src/newstack", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/newstack/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
